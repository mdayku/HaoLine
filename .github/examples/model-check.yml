# HaoLine Model Check - GitHub Actions Workflow
#
# This workflow validates model changes in pull requests by comparing
# the candidate model against a baseline and failing if thresholds are exceeded.
#
# Usage:
#   1. Copy this file to .github/workflows/model-check.yml in your repo
#   2. Update MODEL_BASELINE and MODEL_CANDIDATE paths
#   3. Adjust thresholds as needed
#
# For more info: https://github.com/mdayku/HaoLine

name: Model Check

on:
  pull_request:
    paths:
      - 'models/**'  # Only run when models change
      - '*.onnx'

jobs:
  model-validation:
    name: Validate Model Changes
    runs-on: ubuntu-latest

    env:
      # Configure these for your project
      MODEL_BASELINE: models/baseline.onnx
      MODEL_CANDIDATE: models/candidate.onnx
      # Optional: eval metrics files (if you have them)
      # EVAL_BASELINE: evals/baseline.json
      # EVAL_CANDIDATE: evals/candidate.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch both base and head commits for comparison
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install HaoLine
        run: pip install haoline

      - name: Check baseline model exists
        run: |
          if [ ! -f "$MODEL_BASELINE" ]; then
            echo "::warning::Baseline model not found at $MODEL_BASELINE"
            echo "Skipping comparison - this may be a new model"
            exit 0
          fi

      - name: Analyze baseline model
        if: hashFiles(env.MODEL_BASELINE) != ''
        run: |
          python -m haoline "$MODEL_BASELINE" \
            --out-json baseline_report.json \
            --out-md baseline_report.md

      - name: Analyze candidate model
        run: |
          python -m haoline "$MODEL_CANDIDATE" \
            --out-json candidate_report.json \
            --out-md candidate_report.md

      - name: Compare models with thresholds
        if: hashFiles(env.MODEL_BASELINE) != ''
        id: compare
        run: |
          # Run comparison with failure thresholds
          # Adjust these thresholds for your project:
          #   - latency_increase: max % increase in estimated latency
          #   - memory_increase: max % increase in memory usage
          #   - param_increase: max % increase in parameters
          #   - new_risk_signals: fail if new high-severity risks appear
          
          python -m haoline compare \
            --models "$MODEL_BASELINE" "$MODEL_CANDIDATE" \
            --eval-metrics baseline_report.json candidate_report.json \
            --out-md comparison.md \
            --out-json comparison.json \
            --fail-on latency_increase=10% \
            --fail-on memory_increase=20% \
            --fail-on new_risk_signals

      - name: Post comparison to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Try to read comparison report, fall back to candidate report
            let body;
            if (fs.existsSync('comparison.md')) {
              body = fs.readFileSync('comparison.md', 'utf8');
            } else if (fs.existsSync('candidate_report.md')) {
              body = '## Model Analysis\n\n' + fs.readFileSync('candidate_report.md', 'utf8');
            } else {
              body = '## Model Check\n\nNo report generated.';
            }
            
            // Add header
            const header = '## HaoLine Model Check\n\n';
            const footer = '\n\n---\n*Generated by [HaoLine](https://github.com/mdayku/HaoLine)*';
            
            // Find existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('HaoLine Model Check')
            );
            
            const commentBody = header + body + footer;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: |
            *_report.json
            *_report.md
            comparison.json
            comparison.md
          retention-days: 30

